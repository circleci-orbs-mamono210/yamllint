description: >
  Execute yamllint

usage:
  version: 2.1

  orbs:
    yamllint: orbss/yamllint@x.y.z

  jobs:
    execute-yamllint:
      executor: yamllint/default
      steps:
        - checkout
        - yamllint/install
        - yamllint/execute

  workflows:
    use-my-orb:
      jobs:
        - execute-yamllint
