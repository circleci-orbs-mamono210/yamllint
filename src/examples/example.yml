description: >
  Minimal install and execute configuration prepared for v2.1.0.
  Use the registry reference after publication; development checks use
  the source Orb injected inline, not a published v2.1.0 claim.

usage:
  version: 2.1

  orbs:
    yamllint: orbss/yamllint@2.1.0

  jobs:
    execute-yamllint:
      executor: yamllint/default
      steps:
        - checkout
        - yamllint/install
        - yamllint/execute

  workflows:
    use-my-orb:
      jobs:
        - execute-yamllint
