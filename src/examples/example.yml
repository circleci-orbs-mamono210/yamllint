description: >
  Install and execute yamllint with v2.2.0 using the minimal workflow.

usage:
  version: 2.1

  orbs:
    yamllint: orbss/yamllint@2.2.0

  jobs:
    execute-yamllint:
      executor: yamllint/default
      steps:
        - checkout
        - yamllint/install
        - yamllint/execute

  workflows:
    use-my-orb:
      jobs:
        - execute-yamllint
