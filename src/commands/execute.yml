---
description: >
  Execute yamllint

parameters:
  targets:
    type: string
    default: "."
    description: >
      Files or directories to lint. Multiple targets can be specified
      using one target per line.
  config_file:
    type: string
    default: ""
    description: >
      Path to a yamllint configuration file. Mutually exclusive with
      config_data. If both are empty, yamllint uses its default
      configuration discovery behavior.
  config_data:
    type: string
    default: ""
    description: >
      YAML configuration or a configuration name interpreted by yamllint
      (for example, relaxed). Empty means unspecified. Non-empty values
      are passed unchanged as one argument, including newlines and quotes.
      Mutually exclusive with config_file; specifying both returns exit
      status 2 with an Orb diagnostic before the lint invocation.
  strict:
    type: boolean
    default: false
    description: >
      Enable yamllint strict mode. Warnings cause yamllint to return
      a non-zero exit status when enabled.
  no_warnings:
    type: boolean
    default: false
    description: >
      Hide warning output without changing yamllint's exit status.
      Warning-only input still returns exit status 2 in strict mode.
      Errors remain visible and return exit status 1.
  list_files:
    type: boolean
    default: false
    description: >
      Print the files selected by yamllint to this step's stdout without
      linting them. Selection and exclusion follow upstream configuration.
      Listing does not prove existence, readability, YAML validity or lint
      success, and adds no ordering or deduplication guarantees.
  format:
    type: string
    default: ""
    description: >
      Output format passed to yamllint. If empty, yamllint uses
      its default output format.

steps:
  - run:
      name: Show yamllint version
      command: <<include(scripts/show-version.sh)>>
  - run:
      name: Execute yamllint
      environment:
        PARAM_TARGETS: << parameters.targets >>
        PARAM_CONFIG_FILE: << parameters.config_file >>
        PARAM_CONFIG_DATA: << parameters.config_data >>
        PARAM_STRICT: << parameters.strict >>
        PARAM_NO_WARNINGS: << parameters.no_warnings >>
        PARAM_LIST_FILES: << parameters.list_files >>
        PARAM_FORMAT: << parameters.format >>
      command: <<include(scripts/execute.sh)>>
