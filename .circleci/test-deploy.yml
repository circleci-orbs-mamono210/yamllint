version: 2.1

orbs:
  # The setup workflow injects the packed orb from this revision here.
  yamllint: {}
  orb-tools: circleci/orb-tools@12.5.0

executors:
  orb-pack:
    docker:
      - image: circleci/circleci-cli:1.11.0
    resource_class: medium
    environment:
      CIRCLE_TOKEN: dummy
      CIRCLE_NO_TELEMETRY: "1"
      CIRCLE_NO_UPDATE_CHECK: "1"

filters: &filters
  tags:
    only: /.*/

commands:
  record-runtime:
    parameters:
      image:
        type: string
      requested-version:
        type: string
        default: ""
      cases:
        type: string
    steps:
      - run:
          name: Record resolved runtime for this integration job
          when: always
          environment:
            EVIDENCE_IMAGE: << parameters.image >>
            EVIDENCE_REQUESTED_VERSION: << parameters.requested-version >>
            EVIDENCE_CASES: << parameters.cases >>
          command: |
            mkdir -p /tmp/yamllint-runtime
            python - \<<'PYTHON'
            import importlib.metadata as metadata
            import json, os, platform
            from pathlib import Path
            selected = ("CIRCLE_SHA1", "CIRCLE_JOB", "CIRCLE_BUILD_NUM", "CIRCLE_BUILD_URL",
                        "CIRCLE_WORKFLOW_ID", "CIRCLE_PIPELINE_ID", "CIRCLE_BRANCH", "CIRCLE_TAG")
            packages = {d.metadata["Name"]: d.version for d in metadata.distributions()}
            record = dict(
                evidence_kind="runtime-metadata; job status determines success",
                requested_version=os.environ["EVIDENCE_REQUESTED_VERSION"],
                install_mode="fixed" if os.environ["EVIDENCE_REQUESTED_VERSION"] else "default",
                yamllint=metadata.version("yamllint"), python=platform.python_version(),
                configured_image=os.environ["EVIDENCE_IMAGE"], architecture=platform.machine(),
                cases=os.environ["EVIDENCE_CASES"], packages=packages,
                ci={key: os.environ.get(key, "") for key in selected})
            Path("/tmp/yamllint-runtime/runtime.json").write_text(json.dumps(record, indent=2) + "\n")
            print(json.dumps(record, indent=2))
            PYTHON
      - store_artifacts:
          path: /tmp/yamllint-runtime
          destination: runtime

jobs:
  command-tests:
    executor: yamllint/default
    steps:
      - checkout
      - yamllint/install
      - yamllint/execute

  resource-class-test:
    executor:
      name: yamllint/default
      resource_class: medium
    steps:
      - checkout
      - yamllint/install
      - yamllint/execute

  custom-image-test:
    executor:
      name: yamllint/default
      image: cimg/python:3.13
    steps:
      - checkout
      - yamllint/install
      - yamllint/execute

  install-command-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Verify yamllint installation
          command: yamllint --version

  install-version-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install:
          version: "1.37.1"
      - run:
          name: Verify installed yamllint version
          command: |
            INSTALLED_VERSION="$(
              python -c 'from importlib.metadata import version; print(version("yamllint"))'
            )"

            if [[ "${INSTALLED_VERSION}" != "1.37.1" ]]; then
              echo "Expected yamllint version: 1.37.1"
              echo "Installed yamllint version: ${INSTALLED_VERSION}"
              exit 1
            fi

            echo "yamllint ${INSTALLED_VERSION}"

  negative-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Verify yamllint rejects invalid YAML
          command: |
            mkdir -p /tmp/yamllint-negative

            printf 'foo:\n\tbar: baz\n' \
              > /tmp/yamllint-negative/invalid.yml

            set +e
            (
              cd /tmp/yamllint-negative
              yamllint .
            )
            status=$?
            set -e

            if [[ "${status}" -ne 1 ]]; then
              echo "Expected yamllint exit status 1 for invalid YAML"
              echo "Actual exit status: ${status}"
              exit 1
            fi

            echo "yamllint correctly rejected invalid YAML"

  targets-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Create target test files
          command: |
            mkdir -p \
              targets-test/valid \
              targets-test/invalid

            printf 'foo: bar\n' \
              > targets-test/valid/first.yml

            printf 'bar: baz\n' \
              > targets-test/valid/second.yml

            printf 'foo:\n\tbar: baz\n' \
              > targets-test/invalid/invalid.yml
      - run:
          name: Prepare target selection verifier
          command: |
            REAL_YAMLLINT="$(command -v yamllint)"
            WRAPPER_DIR="$(pwd)/targets-test/bin"

            mkdir -p "${WRAPPER_DIR}"
            printf '%s\n' 'targets-test/valid/' \
              > targets-test/expected-targets.txt
            : > targets-test/verified-calls.txt

            cat > "${WRAPPER_DIR}/yamllint" \<<'BASH'
            #!/bin/bash

            set -euo pipefail

            if [[ "${1:-}" == "--version" ]]; then
                exec "${REAL_YAMLLINT}" "$@"
            fi

            args=("$@")
            if [[ "${1:-}" != "--" ]]; then
                echo "Expected -- before targets" >&2
                exit 1
            fi
            shift

            mapfile -t expected < targets-test/expected-targets.txt
            actual=("$@")

            if [[ "${#actual[@]}" -ne "${#expected[@]}" ]]; then
                echo "Unexpected number of targets passed to yamllint" >&2
                exit 1
            fi

            for index in "${!expected[@]}"; do
                if [[ "${actual[index]}" != "${expected[index]}" ]]; then
                    echo "Unexpected target at index ${index}" >&2
                    exit 1
                fi
            done

            "${REAL_YAMLLINT}" "${args[@]}"
            printf '%s\n' "${actual[*]}" >> targets-test/verified-calls.txt
            BASH

            chmod +x "${WRAPPER_DIR}/yamllint"
            echo "export REAL_YAMLLINT=\"${REAL_YAMLLINT}\"" \
              >> "${BASH_ENV}"
            echo "export PATH=\"${WRAPPER_DIR}:\${PATH}\"" \
              >> "${BASH_ENV}"
      - yamllint/execute:
          targets: targets-test/valid/
      - run:
          name: Select a single file
          command: |
            printf '%s\n' 'targets-test/valid/first.yml' \
              > targets-test/expected-targets.txt
      - yamllint/execute:
          targets: targets-test/valid/first.yml
      - run:
          name: Select multiple files
          command: |
            printf '%s\n' \
              'targets-test/valid/first.yml' \
              'targets-test/valid/second.yml' \
              > targets-test/expected-targets.txt
      - yamllint/execute:
          targets: |
            targets-test/valid/first.yml
            targets-test/valid/second.yml
      - run:
          name: Verify all target selection cases ran
          command: |
            if [[ "$(wc -l < targets-test/verified-calls.txt)" -ne 3 ]]; then
              echo "Expected three verified yamllint invocations" >&2
              exit 1
            fi

  config-file-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Create config file test files
          command: |
            mkdir -p config-file-test

            printf '%s\n' \
              'message: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' \
              > config-file-test/test.yml

            cat > config-file-test/yamllint-ci.yml \<<'YAML'
            extends: default

            rules:
              line-length: disable
            YAML
      - run:
          name: Verify default configuration rejects test file
          command: |
            set +e
            yamllint config-file-test/test.yml
            status=$?
            set -e

            if [[ "${status}" -ne 1 ]]; then
              echo "Expected exit status 1 with the default configuration"
              echo "Actual exit status: ${status}"
              exit 1
            fi

            echo "Default configuration correctly rejected test file"
      - yamllint/execute:
          targets: config-file-test/test.yml
          config_file: config-file-test/yamllint-ci.yml

  strict-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Create strict mode test files
          command: |
            mkdir -p strict-test

            printf '%s\n' \
              'message: this-line-is-longer-than-twenty-characters' \
              > strict-test/test.yml

            cat > strict-test/yamllint.yml \<<'YAML'
            extends: default

            rules:
              line-length:
                max: 20
                level: warning
            YAML
      - yamllint/execute:
          targets: strict-test/test.yml
          config_file: strict-test/yamllint.yml
          strict: false
      - run:
          name: Prepare strict mode verifier
          command: |
            REAL_YAMLLINT="$(command -v yamllint)"
            WRAPPER_DIR="$(pwd)/strict-test/bin"

            mkdir -p "${WRAPPER_DIR}"

            cat > "${WRAPPER_DIR}/yamllint" \<<'BASH'
            #!/bin/bash

            set -euo pipefail

            if [[ "${1:-}" == "--version" ]]; then
                exec "${REAL_YAMLLINT}" "$@"
            fi

            strict_found=false

            for arg in "$@"; do
                if [[ "${arg}" == "--strict" ]]; then
                    strict_found=true
                    break
                fi
            done

            if [[ "${strict_found}" != "true" ]]; then
                echo "Expected --strict to be passed to yamllint" >&2
                exit 1
            fi

            set +e
            "${REAL_YAMLLINT}" "$@"
            status=$?
            set -e

            if [[ "${status}" -ne 2 ]]; then
                echo "Expected yamllint strict mode exit status: 2" >&2
                echo "Actual exit status: ${status}" >&2
                exit 1
            fi

            echo "yamllint strict mode returned expected exit status 2"
            BASH

            chmod +x "${WRAPPER_DIR}/yamllint"

            echo "export REAL_YAMLLINT=\"${REAL_YAMLLINT}\"" \
              >> "${BASH_ENV}"
            echo "export PATH=\"${WRAPPER_DIR}:\${PATH}\"" \
              >> "${BASH_ENV}"
      - yamllint/execute:
          targets: strict-test/test.yml
          config_file: strict-test/yamllint.yml
          strict: true

  format-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Create format test files
          command: |
            mkdir -p format-test

            printf '%s\n' \
              'message: this-line-is-longer-than-twenty-characters' \
              > format-test/test.yml

            cat > format-test/yamllint.yml \<<'YAML'
            extends: default

            rules:
              line-length:
                max: 20
                level: warning
            YAML

      - run:
          name: Prepare format verifier
          command: |
            REAL_YAMLLINT="$(command -v yamllint)"
            WRAPPER_DIR="$(pwd)/format-test/bin"

            mkdir -p "${WRAPPER_DIR}"

            cat > "${WRAPPER_DIR}/yamllint" \<<'BASH'
            #!/bin/bash

            set -euo pipefail

            if [[ "${1:-}" == "--version" ]]; then
                exec "${REAL_YAMLLINT}" "$@"
            fi

            format_found=false

            for ((i = 1; i <= $#; i++)); do
                if [[ "${!i}" == "--format" ]]; then
                    next=$((i + 1))

                    if [[ "${next}" -le "$#" && "${!next}" == "parsable" ]]; then
                        format_found=true
                        break
                    fi
                fi
            done

            if [[ "${format_found}" != "true" ]]; then
                echo "Expected --format parsable to be passed to yamllint" >&2
                exit 1
            fi

            set +e
            output="$("${REAL_YAMLLINT}" "$@" 2>&1)"
            status=$?
            set -e

            printf '%s\n' "${output}"

            if [[ "${status}" -ne 0 ]]; then
                echo "Expected yamllint exit status: 0" >&2
                echo "Actual exit status: ${status}" >&2
                exit 1
            fi

            if ! printf '%s\n' "${output}" \
              | grep -Eq '^format-test/test\.yml:[0-9]+:[0-9]+: \[warning\]'; then
                echo "Expected parsable yamllint output" >&2
                exit 1
            fi

            echo "yamllint parsable format verified"
            BASH

            chmod +x "${WRAPPER_DIR}/yamllint"

            echo "export REAL_YAMLLINT=\"${REAL_YAMLLINT}\"" \
              >> "${BASH_ENV}"
            echo "export PATH=\"${WRAPPER_DIR}:\${PATH}\"" \
              >> "${BASH_ENV}"

      - yamllint/execute:
          targets: format-test/test.yml
          config_file: format-test/yamllint.yml
          format: parsable

  combined-parameters-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Create combined parameter fixtures
          command: |
            mkdir -p combined-test/selected combined-test/unselected

            printf '%s\n' '---' \
              'message: first-line-is-longer-than-twenty-characters' \
              > combined-test/selected/first.yml
            printf '%s\n' '---' \
              'message: second-line-is-longer-than-twenty-characters' \
              > combined-test/selected/second.yml
            printf 'foo:\n\tbar: baz\n' \
              > combined-test/unselected/invalid.yml

            cat > combined-test/yamllint.yml \<<'YAML'
            extends: default

            rules:
              line-length:
                max: 20
                level: warning
            YAML
      - run:
          name: Verify combined fixture controls
          command: |
            # The selected files are clean under the default configuration.
            yamllint --strict --format parsable \
              combined-test/selected/first.yml \
              combined-test/selected/second.yml

            # Including the unselected file must produce an error, not a warning.
            set +e
            yamllint --config-file combined-test/yamllint.yml \
              --strict --format parsable combined-test/unselected/invalid.yml
            status=$?
            set -e

            if [[ "${status}" -ne 1 ]]; then
              echo "Expected exit status 1 for the unselected invalid fixture" >&2
              echo "Actual exit status: ${status}" >&2
              exit 1
            fi
      - run:
          name: Prepare combined parameter verifier
          command: |
            REAL_YAMLLINT="$(command -v yamllint)"
            WRAPPER_DIR="$(pwd)/combined-test/bin"
            mkdir -p "${WRAPPER_DIR}"

            cat > "${WRAPPER_DIR}/yamllint" \<<'BASH'
            #!/bin/bash

            set -euo pipefail

            if [[ "${1:-}" == "--version" ]]; then
                exec "${REAL_YAMLLINT}" "$@"
            fi

            args=("$@")
            config_file=""
            strict=false
            output_format=""
            targets=()
            boundary_found=false

            while [[ "$#" -gt 0 ]]; do
                case "$1" in
                    --)
                        boundary_found=true
                        shift
                        targets=("$@")
                        break
                        ;;
                    --config-file)
                        [[ "$#" -ge 2 && -z "${config_file}" ]] || exit 1
                        config_file="$2"
                        shift 2
                        ;;
                    --strict)
                        [[ "${strict}" == false ]] || exit 1
                        strict=true
                        shift
                        ;;
                    --format)
                        [[ "$#" -ge 2 && -z "${output_format}" ]] || exit 1
                        output_format="$2"
                        shift 2
                        ;;
                    --*)
                        echo "Unexpected option: $1" >&2
                        exit 1
                        ;;
                    *)
                        echo "Unexpected target before --: $1" >&2
                        exit 1
                        ;;
                esac
            done

            if [[ "${boundary_found}" != true ]]; then
                echo "Expected -- before targets" >&2
                exit 1
            fi

            if [[ "${config_file}" != "combined-test/yamllint.yml" \
                || "${strict}" != true || "${output_format}" != parsable ]]; then
                echo "Expected config_file, strict and format together" >&2
                exit 1
            fi

            if [[ "${#targets[@]}" -ne 2 \
                || "${targets[0]}" != "combined-test/selected/first.yml" \
                || "${targets[1]}" != "combined-test/selected/second.yml" ]]; then
                echo "Expected exactly the two selected targets" >&2
                exit 1
            fi

            set +e
            output="$("${REAL_YAMLLINT}" "${args[@]}" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "${output}"

            if [[ "${status}" -ne 2 ]]; then
                echo "Expected warning-only strict exit status 2" >&2
                echo "Actual exit status: ${status}" >&2
                exit 1
            fi

            for target in first second; do
                if ! printf '%s\n' "${output}" \
                    | grep -Eq "^combined-test/selected/${target}\\.yml:[0-9]+:[0-9]+: \\[warning\\]"; then
                    echo "Missing parsable warning for ${target}.yml" >&2
                    exit 1
                fi
            done

            if printf '%s\n' "${output}" \
                | grep -Ev '^combined-test/selected/(first|second)\.yml:[0-9]+:[0-9]+: \[warning\] .+ \(line-length\)$'; then
                echo "Unexpected output or unselected target was linted" >&2
                exit 1
            fi

            touch combined-test/verified
            echo "Combined parameters verified; expected exit status 2 captured"
            BASH

            chmod +x "${WRAPPER_DIR}/yamllint"
            echo "export REAL_YAMLLINT=\"${REAL_YAMLLINT}\"" \
              >> "${BASH_ENV}"
            echo "export PATH=\"${WRAPPER_DIR}:\${PATH}\"" \
              >> "${BASH_ENV}"
      - yamllint/execute:
          targets: |
            combined-test/selected/first.yml
            combined-test/selected/second.yml
          config_file: combined-test/yamllint.yml
          strict: true
          format: parsable
      - run:
          name: Verify combined command actually ran
          command: test -f combined-test/verified

  compatibility-tests:
    environment:
      VERIFICATION_SCOPE: source
      VERIFICATION_IMAGE: cimg/python:<< parameters.python-version >>
      EXPECTED_YAMLLINT: << parameters.yamllint-version >>
    parameters:
      yamllint-version:
        type: enum
        enum: ["1.37.1", "1.38.0"]
      python-version:
        type: enum
        enum: ["3.13", "3.14"]
    executor:
      name: yamllint/default
      image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - yamllint/install:
          version: << parameters.yamllint-version >>
      - run:
          name: Run fixed-version feature, refusal and combination checks
          command: >
            python .circleci/run-compatibility.py
            --version << parameters.yamllint-version >>
            --python-version << parameters.python-version >>
            --evidence-dir /tmp/yamllint-compatibility
      # The actual inline command also runs with every new parameter omitted.
      - yamllint/execute
      - run:
          name: Prepare fixtures and real-upstream observer
          command: python .circleci/verify-boolean-parameters.py prepare
      - run:
          name: Expect config-file
          command: python .circleci/verify-boolean-parameters.py expect config-file
      - yamllint/execute:
          targets: consumer-fixtures/long.yml
          config_file: consumer-fixtures/config.yml
      - run:
          name: Expect config-data
          command: python .circleci/verify-boolean-parameters.py expect config-data
      - yamllint/execute:
          targets: consumer-fixtures/long.yml
          config_data: "extends: default\nrules:\n  line-length: disable\n"
      - run:
          name: Expect visible-strict-warning
          command: python .circleci/verify-boolean-parameters.py expect visible-strict-warning
      - yamllint/execute:
          targets: consumer-fixtures/warning.yml
          config_data: "extends: default\nrules:\n  line-length:\n    max: 30\n    level: warning\n"
          strict: true
          format: parsable
      - run:
          name: Expect hidden-warning
          command: python .circleci/verify-boolean-parameters.py expect hidden-warning
      - yamllint/execute:
          targets: consumer-fixtures/warning.yml
          config_data: "extends: default\nrules:\n  line-length:\n    max: 30\n    level: warning\n"
          strict: false
          no_warnings: true
          format: parsable
      - run:
          name: Expect hidden-strict-warning
          command: python .circleci/verify-boolean-parameters.py expect hidden-strict-warning
      - yamllint/execute:
          targets: consumer-fixtures/warning.yml
          config_data: "extends: default\nrules:\n  line-length:\n    max: 30\n    level: warning\n"
          strict: true
          no_warnings: true
          format: parsable
      - run:
          name: Expect visible-error
          command: python .circleci/verify-boolean-parameters.py expect visible-error
      - yamllint/execute:
          targets: consumer-fixtures/error.yml
          config_data: 'extends: default'
          strict: true
          no_warnings: true
          format: parsable
      - run:
          name: Expect list-files
          command: python .circleci/verify-boolean-parameters.py expect list-files
      - yamllint/execute:
          targets: consumer-fixtures/listing
          config_data: 'extends: relaxed

            yaml-files: ["*.yml"]

            ignore: ["consumer-fixtures/listing/skip.yml"]

            '
          list_files: true
      - run:
          name: Expect default-booleans
          command: python .circleci/verify-boolean-parameters.py expect default-booleans
      - yamllint/execute:
          targets: consumer-fixtures/warning.yml
          config_data: "extends: default\nrules:\n  line-length:\n    max: 30\n    level: warning\n"
          format: parsable
      - run:
          name: Expect false-booleans
          command: python .circleci/verify-boolean-parameters.py expect false-booleans
      - yamllint/execute:
          targets: consumer-fixtures/warning.yml
          config_data: "extends: default\nrules:\n  line-length:\n    max: 30\n    level: warning\n"
          format: parsable
          strict: false
          no_warnings: false
          list_files: false
      - run:
          name: Expect literal-targets
          command: python .circleci/verify-boolean-parameters.py expect literal-targets
      - yamllint/execute:
          targets: '-consumer.yml

            ./-

            consumer-fixtures/valid.yml'
      - run:
          name: Verify all body calls and results
          command: python .circleci/verify-boolean-parameters.py finish
      - store_artifacts:
          path: .boolean-evidence
          destination: boolean-runtime
      - store_artifacts:
          path: /tmp/yamllint-compatibility
          destination: compatibility

workflows:
  test-deploy:
    jobs:
      - command-tests:
          filters: *filters
          post-steps:
            - record-runtime:
                image: cimg/python:3.14
                cases: command-tests
      - resource-class-test:
          filters: *filters
          post-steps:
            - record-runtime:
                image: cimg/python:3.14
                cases: resource-class-test
      - custom-image-test:
          filters: *filters
          post-steps:
            - record-runtime:
                image: cimg/python:3.13
                cases: custom-image-test
      - install-command-test:
          filters: *filters
          post-steps:
            - record-runtime:
                image: cimg/python:3.14
                cases: install-command-test
      - install-version-test:
          filters: *filters
          post-steps:
            - record-runtime:
                image: cimg/python:3.14
                cases: install-version-test
                requested-version: "1.37.1"
      - negative-test:
          filters: *filters
          post-steps:
            - record-runtime:
                image: cimg/python:3.14
                cases: negative-test
      - targets-test:
          filters: *filters
          post-steps:
            - record-runtime:
                image: cimg/python:3.14
                cases: targets-test
      - config-file-test:
          filters: *filters
          post-steps:
            - record-runtime:
                image: cimg/python:3.14
                cases: config-file-test
      - strict-test:
          filters: *filters
          post-steps:
            - record-runtime:
                image: cimg/python:3.14
                cases: strict-test
      - format-test:
          filters: *filters
          post-steps:
            - record-runtime:
                image: cimg/python:3.14
                cases: format-test
      - combined-parameters-test:
          filters: *filters
          post-steps:
            - record-runtime:
                image: cimg/python:3.14
                cases: combined-parameters-test
      - compatibility-tests:
          name: compatibility-<< matrix.yamllint-version >>-py<< matrix.python-version >>
          matrix:
            alias: compatibility-matrix
            parameters:
              yamllint-version: ["1.37.1", "1.38.0"]
              python-version: ["3.13", "3.14"]
          filters: *filters
      - orb-tools/pack:
          executor: orb-pack
          filters: *filters
          # Every integration test must succeed before packaging for publication.
          requires:
            - command-tests
            - resource-class-test
            - custom-image-test
            - install-command-test
            - install-version-test
            - negative-test
            - targets-test
            - config-file-test
            - strict-test
            - format-test
            - combined-parameters-test
            - compatibility-matrix
      - orb-tools/publish:
          orb_name: orbss/yamllint
          vcs_type: << pipeline.project.type >>
