version: 2.1

orbs:
  yamllint: orbss/yamllint@dev:<<pipeline.git.revision>>
  orb-tools: circleci/orb-tools@11.1

filters: &filters
  tags:
    only: /.*/

jobs:
  command-tests:
    executor: yamllint/default
    steps:
      - checkout
      - yamllint/install
      - yamllint/execute

  resource-class-test:
    executor:
      name: yamllint/default
      resource_class: medium
    steps:
      - checkout
      - yamllint/install
      - yamllint/execute

  custom-image-test:
    executor:
      name: yamllint/default
      image: cimg/python:3.13
    steps:
      - checkout
      - yamllint/install
      - yamllint/execute

  install-command-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Verify yamllint installation
          command: yamllint --version

  install-version-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install:
          version: "1.37.1"
      - run:
          name: Verify installed yamllint version
          command: |
            INSTALLED_VERSION="$(
              python -c 'from importlib.metadata import version; print(version("yamllint"))'
            )"

            if [[ "${INSTALLED_VERSION}" != "1.37.1" ]]; then
              echo "Expected yamllint version: 1.37.1"
              echo "Installed yamllint version: ${INSTALLED_VERSION}"
              exit 1
            fi

            echo "yamllint ${INSTALLED_VERSION}"

  negative-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Verify yamllint rejects invalid YAML
          command: |
            mkdir -p /tmp/yamllint-negative

            printf 'foo:\n\tbar: baz\n' \
              > /tmp/yamllint-negative/invalid.yml

            set +e
            (
              cd /tmp/yamllint-negative
              yamllint .
            )
            status=$?
            set -e

            if [[ "${status}" -eq 0 ]]; then
              echo "Expected yamllint to fail for invalid YAML"
              exit 1
            fi

            echo "yamllint correctly rejected invalid YAML"

  targets-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Create target test files
          command: |
            mkdir -p \
              targets-test/valid \
              targets-test/invalid

            printf 'foo: bar\n' \
              > targets-test/valid/first.yml

            printf 'bar: baz\n' \
              > targets-test/valid/second.yml

            printf 'foo:\n\tbar: baz\n' \
              > targets-test/invalid/invalid.yml
      - yamllint/execute:
          targets: targets-test/valid/
      - yamllint/execute:
          targets: |
            targets-test/valid/first.yml
            targets-test/valid/second.yml

  config-file-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Create config file test files
          command: |
            mkdir -p config-file-test

            printf '%s\n' \
              'message: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' \
              > config-file-test/test.yml

            cat > config-file-test/yamllint-ci.yml \<<'YAML'
            extends: default

            rules:
              line-length: disable
            YAML
      - run:
          name: Verify default configuration rejects test file
          command: |
            set +e
            yamllint config-file-test/test.yml
            status=$?
            set -e

            if [[ "${status}" -eq 0 ]]; then
              echo "Expected default yamllint configuration to reject test file"
              exit 1
            fi

            echo "Default configuration correctly rejected test file"
      - yamllint/execute:
          targets: config-file-test/test.yml
          config-file: config-file-test/yamllint-ci.yml

  strict-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Create strict mode test files
          command: |
            mkdir -p strict-test

            printf '%s\n' \
              'message: this-line-is-longer-than-twenty-characters' \
              > strict-test/test.yml

            cat > strict-test/yamllint.yml \<<'YAML'
            extends: default

            rules:
              line-length:
                max: 20
                level: warning
            YAML
      - yamllint/execute:
          targets: strict-test/test.yml
          config-file: strict-test/yamllint.yml
          strict: false
      - run:
          name: Prepare strict mode verifier
          command: |
            REAL_YAMLLINT="$(command -v yamllint)"
            WRAPPER_DIR="$(pwd)/strict-test/bin"

            mkdir -p "${WRAPPER_DIR}"

            cat > "${WRAPPER_DIR}/yamllint" \<<'BASH'
            #!/bin/bash

            set -euo pipefail

            if [[ "${1:-}" == "--version" ]]; then
                exec "${REAL_YAMLLINT}" "$@"
            fi

            strict_found=false

            for arg in "$@"; do
                if [[ "${arg}" == "--strict" ]]; then
                    strict_found=true
                    break
                fi
            done

            if [[ "${strict_found}" != "true" ]]; then
                echo "Expected --strict to be passed to yamllint" >&2
                exit 1
            fi

            set +e
            "${REAL_YAMLLINT}" "$@"
            status=$?
            set -e

            if [[ "${status}" -ne 2 ]]; then
                echo "Expected yamllint strict mode exit status: 2" >&2
                echo "Actual exit status: ${status}" >&2
                exit 1
            fi

            echo "yamllint strict mode returned expected exit status 2"
            BASH

            chmod +x "${WRAPPER_DIR}/yamllint"

            echo "export REAL_YAMLLINT=\"${REAL_YAMLLINT}\"" \
              >> "${BASH_ENV}"
            echo "export PATH=\"${WRAPPER_DIR}:\${PATH}\"" \
              >> "${BASH_ENV}"
      - yamllint/execute:
          targets: strict-test/test.yml
          config-file: strict-test/yamllint.yml
          strict: true

workflows:
  test-deploy:
    jobs:
      - command-tests:
          filters: *filters
      - resource-class-test:
          filters: *filters
      - custom-image-test:
          filters: *filters
      - install-command-test:
          filters: *filters
      - install-version-test:
          filters: *filters
      - negative-test:
          filters: *filters
      - targets-test:
          filters: *filters
      - config-file-test:
          filters: *filters
      - strict-test:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/publish:
          orb-name: orbss/yamllint
          vcs-type: << pipeline.project.type >>
          pub-type: production
          requires:
            - orb-tools/pack
            - command-tests
            - resource-class-test
            - custom-image-test
            - install-command-test
            - install-version-test
            - negative-test
            - targets-test
            - config-file-test
            - strict-test
          context: CIRCLECI_ORBS
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
