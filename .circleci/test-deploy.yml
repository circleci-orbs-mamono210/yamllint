version: 2.1

orbs:
  yamllint: orbss/yamllint@dev:<<pipeline.git.revision>>
  orb-tools: circleci/orb-tools@11.1

filters: &filters
  tags:
    only: /.*/

jobs:
  command-tests:
    executor: yamllint/default
    steps:
      - checkout
      - yamllint/install
      - yamllint/execute

  resource-class-test:
    executor:
      name: yamllint/default
      resource_class: medium
    steps:
      - checkout
      - yamllint/install
      - yamllint/execute

  custom-image-test:
    executor:
      name: yamllint/default
      image: cimg/python:3.13
    steps:
      - checkout
      - yamllint/install
      - yamllint/execute

  install-command-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Verify yamllint installation
          command: yamllint --version

  install-version-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install:
          version: "1.37.1"
      - run:
          name: Verify installed yamllint version
          command: |
            INSTALLED_VERSION="$(
              python -c 'from importlib.metadata import version; print(version("yamllint"))'
            )"

            if [[ "${INSTALLED_VERSION}" != "1.37.1" ]]; then
              echo "Expected yamllint version: 1.37.1"
              echo "Installed yamllint version: ${INSTALLED_VERSION}"
              exit 1
            fi

            echo "yamllint ${INSTALLED_VERSION}"

  negative-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Verify yamllint rejects invalid YAML
          command: |
            mkdir -p /tmp/yamllint-negative

            printf 'foo:\n\tbar: baz\n' \
              > /tmp/yamllint-negative/invalid.yml

            set +e
            (
              cd /tmp/yamllint-negative
              yamllint .
            )
            status=$?
            set -e

            if [[ "${status}" -eq 0 ]]; then
              echo "Expected yamllint to fail for invalid YAML"
              exit 1
            fi

            echo "yamllint correctly rejected invalid YAML"

  targets-test:
    docker:
      - image: cimg/python:3.14
    steps:
      - yamllint/install
      - run:
          name: Create target test files
          command: |
            mkdir -p \
              targets-test/valid \
              targets-test/invalid

            printf 'foo: bar\n' \
              > targets-test/valid/first.yml

            printf 'bar: baz\n' \
              > targets-test/valid/second.yml

            printf 'foo:\n\tbar: baz\n' \
              > targets-test/invalid/invalid.yml
      - yamllint/execute:
          targets: targets-test/valid/
      - yamllint/execute:
          targets: |
            targets-test/valid/first.yml
            targets-test/valid/second.yml

workflows:
  test-deploy:
    jobs:
      - command-tests:
          filters: *filters
      - resource-class-test:
          filters: *filters
      - custom-image-test:
          filters: *filters
      - install-command-test:
          filters: *filters
      - install-version-test:
          filters: *filters
      - negative-test:
          filters: *filters
      - targets-test:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/publish:
          orb-name: orbss/yamllint
          vcs-type: << pipeline.project.type >>
          pub-type: production
          requires:
            - orb-tools/pack
            - command-tests
            - resource-class-test
            - custom-image-test
            - install-command-test
            - install-version-test
            - negative-test
            - targets-test
          context: CIRCLECI_ORBS
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
