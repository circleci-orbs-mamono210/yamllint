version: 2.1
setup: true

orbs:
  orb-tools: circleci/orb-tools@12.5.0
  shellcheck: circleci/shellcheck@3.4.0

executors:
  orb-pack:
    docker:
      - image: circleci/circleci-cli:1.11.0
    resource_class: medium
    environment:
      CIRCLE_TOKEN: dummy
      CIRCLE_NO_TELEMETRY: "1"
      CIRCLE_NO_UPDATE_CHECK: "1"

filters: &filters
  tags:
    only: /.*/

workflows:
  lint-pack:
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          executor: orb-pack
          filters: *filters
      - orb-tools/review:
          orb_name: yamllint
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Inject the packed orb into the downstream test configuration.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: yamllint
          inject_orb: true
          requires:
            - orb-tools/lint
            - orb-tools/pack
            - orb-tools/review
            - shellcheck/check
          filters: *filters
