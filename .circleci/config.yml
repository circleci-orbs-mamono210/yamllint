---
# Supplement to pipeline 172 for Redmine #5545. See section 11.1 on main.
#
# v2.3.0 Phase 1 design investigation. Plan: .circleci/MEASUREMENT_PLAN_V2_3_0.md
# on main (#5543). This file belongs ONLY on the throwaway branch exp/230-m2,
# copied to .circleci/config.yml there. It must never be merged into main.
# It starts only after #5544 is complete and its deliverable version is fixed.
#
# Handoff is observed across real, separate run steps. A result obtained from a
# child process inside one step is never recorded as a step boundary result.
version: 2.1

# These are measurement-only inputs, copied from the human's approval record.
parameters:
  approved-commit:
    type: string
    default: ""
  approved-config-sha256:
    type: string
    default: ""

commands:
  write_helper:
    description: Write the observation helper and the identity probe.
    steps:
      - run:
          name: M-00a Write the observation helper
          command: |
            set -euo pipefail
            mkdir -p /tmp/meas
            cat > /tmp/meas/obs.sh \<<'HELPER'
            MEAS_DIR=/tmp/meas
            MEAS_LOG="${MEAS_DIR}/${MEAS_ENV_ID}.log"
            MEAS_INDEX="${MEAS_DIR}/${MEAS_ENV_ID}.index.tsv"
            mkdir -p "${MEAS_DIR}/readings/${MEAS_ENV_ID}"
            if [ ! -f "${MEAS_INDEX}" ]; then
                printf 'reading\texit\tstdout\tstderr\n' > "${MEAS_INDEX}"
            fi

            # Expected refusals are observations. Gates below explicitly reject failures.
            obs() {
                local id="$1"
                shift
                [[ "${id}" =~ ^[a-zA-Z0-9_.-]+$ ]] || return 2
                OBS_STDOUT="${MEAS_DIR}/readings/${MEAS_ENV_ID}/${id}.stdout"
                OBS_STDERR="${MEAS_DIR}/readings/${MEAS_ENV_ID}/${id}.stderr"
                {
                    printf '\n===== %s =====\ncmd:' "${id}"
                    printf ' %q' "$@"
                    printf '\nstdout: %s\nstderr: %s\n' "${OBS_STDOUT}" "${OBS_STDERR}"
                } >> "${MEAS_LOG}"
                OBS_STATUS=0
                "$@" > "${OBS_STDOUT}" 2> "${OBS_STDERR}" || OBS_STATUS=$?
                {
                    printf '%s\n' '--- stdout ---'
                    cat "${OBS_STDOUT}"
                    printf '\n%s\n' '--- stderr ---'
                    cat "${OBS_STDERR}"
                    printf '\nexit: %d\n' "${OBS_STATUS}"
                } >> "${MEAS_LOG}"
                printf '%s\t%d\t%s\t%s\n' "${id}" "${OBS_STATUS}" "${OBS_STDOUT}" "${OBS_STDERR}" >> "${MEAS_INDEX}"
                return 0
            }

            obs_sh() {
                local id="$1"
                shift
                obs "${id}" /bin/bash -o pipefail -c "$*"
            }

            note() {
                printf '\n--- note: %s\n' "$*" >> "${MEAS_LOG}"
            }

            stop() {
                note "STOP: $*; subsequent cases were not run"
                printf 'STOP: %s\n' "$*" >&2
                return 1
            }

            require_obs() {
                local id="$1"
                shift
                obs "${id}" "$@"
                if [ "${OBS_STATUS}" -ne 0 ]; then
                    stop "${id} failed with status ${OBS_STATUS}"
                    return 1
                fi
            }

            check_revision() {
                local actual_sha actual_hash rest dirty
                [[ "${MEAS_APPROVED_COMMIT:-}" =~ ^[0-9a-f]{40}$ ]] || { stop 'approved commit is missing or malformed'; return 1; }
                [[ "${MEAS_APPROVED_CONFIG_SHA256:-}" =~ ^[0-9a-f]{64}$ ]] || { stop 'approved config hash is missing or malformed'; return 1; }
                require_obs revision-sha git rev-parse HEAD || return 1
                IFS= read -r actual_sha < "${OBS_STDOUT}"
                require_obs config-hash sha256sum .circleci/config.yml || return 1
                read -r actual_hash rest < "${OBS_STDOUT}"
                require_obs worktree-clean git status --porcelain || return 1
                dirty="${OBS_STDOUT}"
                obs revision-branch git rev-parse --abbrev-ref HEAD
                obs commit-subject git log -1 --pretty=%s
                obs_sh pipeline 'printf "pipeline=%s job=%s build_url=%s workflow=%s\n" "${MEAS_PIPELINE_NUMBER:-}" "${CIRCLE_JOB:-}" "${CIRCLE_BUILD_URL:-}" "${CIRCLE_WORKFLOW_ID:-}"'
                [ "${actual_sha}" = "${MEAS_APPROVED_COMMIT}" ] || { stop 'experiment commit differs from the approved commit'; return 1; }
                [ "${actual_hash}" = "${MEAS_APPROVED_CONFIG_SHA256}" ] || { stop 'configuration differs from the approved hash'; return 1; }
                [ ! -s "${dirty}" ] || { stop 'working tree is not clean'; return 1; }
                [ "${CIRCLE_SHA1:-}" = "${actual_sha}" ] || { stop 'pipeline revision differs from checkout'; return 1; }
                [ "${CIRCLE_BRANCH:-}" = "exp/230-${MEAS_STAGE}" ] || { stop 'unexpected experiment branch'; return 1; }
                note 'approved revision and configuration matched; checkout is clean'
            }

            show_index() {
                note "evidence index: ${MEAS_INDEX}; raw streams are separate files"
                cat "${MEAS_INDEX}" >> "${MEAS_LOG}"
            }
            HELPER
            cat > /tmp/meas/probe-identity.sh \<<'PROBE'
            #!/bin/bash
            # M-00 identity and PEP 668 marker readings. $1 is the phase label.
            set -u
            source /tmp/meas/obs.sh
            PHASE="$1"
            note "identity phase=${PHASE} image=${MEAS_IMAGE:-unknown}"
            obs "id-user-${PHASE}" id -u
            obs "uname-${PHASE}" uname -m
            obs "os-release-${PHASE}" cat /etc/os-release
            for c in python python3 pip pip3 git ssh yamllint; do
                obs "which-${c}-${PHASE}" command -v "${c}"
            done
            obs "python3-version-${PHASE}" python3 -VV
            obs "stdlib-${PHASE}" python3 -c 'import sysconfig; print(sysconfig.get_path("stdlib"))'
            obs "venv-state-${PHASE}" python3 -c 'import sys; print(sys.prefix, sys.base_prefix, sys.prefix != sys.base_prefix)'
            obs "pip-version-${PHASE}" python3 -m pip --version
            STDLIB="$(python3 -c 'import sysconfig; print(sysconfig.get_path("stdlib"))' 2>/dev/null || true)"
            if [ -n "${STDLIB}" ]; then
                obs "marker-sysconfig-${PHASE}" ls -l "${STDLIB}/EXTERNALLY-MANAGED"
            else
                note "stdlib path unavailable; marker-sysconfig-${PHASE} not read"
            fi
            obs_sh "marker-usrlib-${PHASE}" 'ls -l /usr/lib/python3*/EXTERNALLY-MANAGED'
            obs_sh "marker-head-${PHASE}" 'head -20 /usr/lib/python3*/EXTERNALLY-MANAGED'
            PROBE
            cat > /tmp/meas/check-candidate.py \<<'CANDIDATE'
            #!/usr/bin/env python3
            """Check only the planned candidate roles, not any product behaviour."""
            import json
            import os
            from pathlib import Path
            import shutil
            import sys
            import sysconfig


            def failures(role, facts):
                expected = {
                    'E01': (True, False, '3.14', None, None),
                    'E02': (True, False, '3.13', None, None),
                    'E03': (False, False, None, 'ubuntu', '22.04'),
                    'E04': (False, True, None, 'ubuntu', '24.04'),
                    'E05': (False, True, None, 'debian', '12'),
                }
                if role not in expected:
                    return ['unknown candidate role']
                python, marker, version, distro, release = expected[role]
                errors = []
                if facts['python_present'] != python:
                    errors.append('python command presence differs from the role')
                if facts['marker_present'] != marker:
                    errors.append('base stdlib marker state differs from the role')
                if facts['in_venv']:
                    errors.append('base python3 is already inside a virtual environment')
                if version and facts['python_version'] != version:
                    errors.append('Python minor version differs from the image role')
                if distro and (facts['os_id'], facts['os_version']) != (distro, release):
                    errors.append('distribution identity differs from the image role')
                return errors


            def main():
                release = {}
                for line in Path('/etc/os-release').read_text().splitlines():
                    if '=' in line:
                        key, value = line.split('=', 1)
                        release[key] = value.strip('"')
                stdlib = Path(sysconfig.get_path('stdlib'))
                facts = {
                    'python_present': shutil.which('python') is not None,
                    'marker_present': (stdlib / 'EXTERNALLY-MANAGED').is_file(),
                    'in_venv': sys.prefix != sys.base_prefix,
                    'python_version': f'{sys.version_info.major}.{sys.version_info.minor}',
                    'os_id': release.get('ID'),
                    'os_version': release.get('VERSION_ID'),
                }
                role = os.environ['MEAS_ENV_ID'].split('-')[0]
                print(json.dumps({'role': role, **facts}, sort_keys=True))
                errors = failures(role, facts)
                for error in errors:
                    print('STOP: ' + error, file=sys.stderr)
                return 2 if errors else 0


            if __name__ == '__main__':
                sys.exit(main())
            CANDIDATE
            chmod +x /tmp/meas/probe-identity.sh
            printf 'env_id=%s image=%s\n' "${MEAS_ENV_ID}" "${MEAS_IMAGE}" \
              > "/tmp/meas/${MEAS_ENV_ID}.log"

  identify:
    description: M-00 identity and marker readings, repeated for this stage.
    parameters:
      phase:
        type: string
    steps:
      - run:
          name: M-00 identity and marker (<< parameters.phase >>)
          command: /tmp/meas/probe-identity.sh << parameters.phase >>

  apt_prepare:
    description: >
      Consumer-side preparation for the plain distribution images, recorded as
      consumer-side work and not as an Orb capability.
    steps:
      - run:
          name: M-00b Consumer-side preparation (apt)
          command: |
            set -euo pipefail
            source /tmp/meas/obs.sh
            export DEBIAN_FRONTEND=noninteractive
            require_obs "apt-update" apt-get update
            require_obs "apt-install" apt-get install -y --no-install-recommends python3 python3-venv python3-pip git ca-certificates openssh-client
            obs "apt-versions" dpkg-query -W -f '${Package} ${Version}\n' python3 python3-venv python3-pip git

  candidate_gate:
    description: Stop a candidate whose prepared base environment fails its role.
    steps:
      - run:
          name: M-00c Enforce the candidate role
          command: |
            set -euo pipefail
            source /tmp/meas/obs.sh
            require_obs candidate-role python3 /tmp/meas/check-candidate.py
            require_obs candidate-pip python3 -m pip --version
            if [ "${MEAS_STAGE}" = m1 ] && [[ "${MEAS_ENV_ID}" =~ ^E0[345]$ ]]; then
                obs_sh venv-packages-before-first-attempt "dpkg-query -W -f='\${binary:Package} \${db:Status-Status}\n' 'python3*-venv'"
                if grep -q ' installed$' "${OBS_STDOUT}"; then
                    stop 'a distribution venv package is already installed before M1-03'
                elif [ "${OBS_STATUS}" -gt 1 ]; then
                    stop 'could not inspect the distribution venv package state'
                fi
            fi

  revision_gate:
    description: Bind this checkout to the externally supplied approval values.
    steps:
      - run:
          name: Check the approved experiment revision
          command: |
            set -euo pipefail
            source /tmp/meas/obs.sh
            printf '%s\n' "${PWD}" > /tmp/meas/repo_path
            check_revision

  store:
    description: Upload the record. Runs even when an earlier step failed.
    steps:
      - store_artifacts:
          path: /tmp/m2-artifacts
          destination: measurement-m2-supplement

jobs:
  m2:
    description: >
      #5545 supplementary run. C2/C3/C5/C6 after pipeline 172.
    parameters:
      env_id:
        type: string
      image:
        type: string
      apt:
        type: boolean
        default: false
    docker:
      - image: << parameters.image >>
    resource_class: small
    environment:
      MEAS_STAGE: m2
      MEAS_APPROVED_COMMIT: << pipeline.parameters.approved-commit >>
      MEAS_APPROVED_CONFIG_SHA256: << pipeline.parameters.approved-config-sha256 >>
      MEAS_PIPELINE_NUMBER: << pipeline.number >>
      MEAS_ENV_ID: << parameters.env_id >>
      MEAS_IMAGE: << parameters.image >>
    steps:
      - write_helper
      - run:
          name: Validate approval parameter format before candidate preparation
          command: |
            set -eu
            [[ "$MEAS_APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ && "$MEAS_APPROVED_CONFIG_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
              echo 'Invalid approval parameters. Copy the two recorded lowercase hex values without whitespace.' >&2
              exit 1
            }
      - identify:
          phase: before-preparation
      - when:
          condition: << parameters.apt >>
          steps:
            - apt_prepare
            - identify:
                phase: after-preparation
      - candidate_gate
      - checkout
      - revision_gate
      - run:
          name: S0 Prepare both environments and record the base before handoff
          command: |
            set -euo pipefail
            mkdir -p /tmp/m2-work/tracer /tmp/m2-work/save-wrapper
            cat > /tmp/m2-work/shared.sh \<<'M2_FILE'
            # Sourced by the actual CircleCI step shell and by controlled subprocesses.
            set -euo pipefail
            source /tmp/meas/obs.sh
            W=/tmp/m2-work
            A=$W/A
            B=$W/B
            FIX=$W/fixtures
            OUT=/tmp/meas/saved
            TRACE=/tmp/meas/traces
            IFS= read -r REPO < /tmp/meas/repo_path

            # These builtins run in the calling shell. No dump of the environment or BASH_ENV.
            shell_view() {
                local cli python
                cli=$(type -P yamllint) || cli=ABSENT
                python=$(type -P python3) || python=ABSENT
                printf 'yamllint=%s\npython3=%s\nPATH=%s\nconsumer_marker=%s\n' \
                    "$cli" "$python" "$PATH" "${M2_USER_MARK:-absent}"
            }
            prefix_snapshot() {
                wc -c < "$BASH_ENV" > "$W/user-prefix.size"
                sha256sum < "$BASH_ENV" | cut -d' ' -f1 > "$W/user-prefix.hash"
                printf 'controlled consumer prefix includes %s bytes\n' "$(< "$W/user-prefix.size")"
            }
            prefix_check() {
                local bytes digest
                bytes=$(< "$W/user-prefix.size")
                digest=$(head -c "$bytes" "$BASH_ENV" | sha256sum | cut -d' ' -f1)
                if [[ $digest == "$(< "$W/user-prefix.hash")" ]]; then
                    printf 'original %s bytes match\n' "$bytes"
                else
                    printf 'original %s bytes differ\n' "$bytes"
                    return 1
                fi
                [[ ${M2_USER_MARK:-} == consumer-r1 ]]
            }
            M2_FILE
            cat > /tmp/m2-work/cases.sh \<<'M2_FILE'
            #!/bin/bash
            source /tmp/m2-work/shared.sh
            cd "$FIX"
            BASE=$(< "$W/base-python")
            BASE_PATH=$(< "$W/base-path")
            export PARAM_CONFIG_FILE="$FIX/warn.cfg" PARAM_CONFIG_DATA="" PARAM_FORMAT=parsable
            export PARAM_STRICT=false PARAM_LIST_FILES=false PARAM_NO_WARNINGS=false PARAM_OUTPUT_FILE=""
            export PARAM_TARGETS="tree/ok.yml"
            run_path() {
                local id=$1 path=$2 script=$3
                shift 3
                obs "$id" /usr/bin/env "PATH=$path" "$@" /bin/bash "$REPO/src/scripts/$script.sh"
            }
            show_trace() {
                local label=$1
                require_obs "$label-trace" cat "$TRACE/$label.jsonl"
            }
            run_route() {
                local role=$1 path=$2 op script id
                for op in show lint listing; do
                    id="route-$role-$op"; script=execute
                    PARAM_LIST_FILES=false
                    if [[ $op == show ]]; then script=show-version; fi
                    if [[ $op == listing ]]; then PARAM_LIST_FILES=true; fi
                    run_path "$id" "$path" "$script" "PYTHONPATH=$W/tracer" "M2_CLI_TRACE=$TRACE/$id.jsonl"
                    run_path "$id-plain" "$path" "$script"
                    show_trace "$id"
                done
                PARAM_LIST_FILES=false
            }
            case "$1" in
                resolution)
                    for py in "$BASE" "$A/bin/python" "$B/bin/python"; do
                        label=base
                        if [[ $py == "$A/bin/python" ]]; then label=A; fi
                        if [[ $py == "$B/bin/python" ]]; then label=B; fi
                        obs "module-$label-file" "$py" -c 'import sys; print(sys.executable, sys.prefix, sys.base_prefix, flush=True); import yamllint; print(yamllint.__file__, yamllint.__version__)'
                        obs "module-$label-launch" "$py" -m yamllint --version
                    done
                    run_route A "$A/bin:$B/bin:$BASE_PATH"
                    run_route B "$B/bin:$A/bin:$BASE_PATH"
                    # The clean base can legitimately contain a CLI. Record it independently of no-cli.
                    obs base-cli-resolution /usr/bin/env "PATH=$BASE_PATH" /bin/bash -c 'type -P yamllint'
                    if [[ $OBS_STATUS == 0 ]]; then
                        run_route base "$BASE_PATH"
                    else
                        run_path base-show "$BASE_PATH" show-version
                        run_path base-lint "$BASE_PATH" execute
                        PARAM_LIST_FILES=true run_path base-listing "$BASE_PATH" execute
                    fi
                    ;;
                saving)
                    export PARAM_TARGETS=tree/warn.yml
                    for role in base venv; do
                        path="$W/lint-A:$BASE_PATH"
                        if [[ $role == venv ]]; then path="$W/lint-A:$A/bin:$BASE_PATH"; fi
                        resolved=$(PATH="$path" type -P python3)
                        id="save-$role"
                        obs "$id-resolution" /usr/bin/env "PATH=$path" /bin/bash -c 'type -P yamllint; type -P python3; python3 -I -c "import sys; print(sys.executable, sys.prefix, sys.base_prefix)"'
                        PARAM_OUTPUT_FILE="$OUT/$id-traced.txt"
                        run_path "$id" "$W/save-wrapper:$path" execute "M2_REAL_PY=$resolved" "M2_SAVE_TRACE=$TRACE/$id.jsonl" "PYTHONPATH=$W/tracer" "M2_CLI_TRACE=$TRACE/$id-cli.jsonl"
                        show_trace "$id"
                        show_trace "$id-cli"
                        PARAM_OUTPUT_FILE="$OUT/$id-plain.txt"
                        run_path "$id-plain" "$path" execute
                        obs "$id-isolated" /usr/bin/env "PATH=$path" python3 -I -c 'import select,sys; print(sys.executable,sys.flags.isolated,select.__spec__.origin)'
                        obs "$id-ordinary" /usr/bin/env "PATH=$path" python3 -c 'import select,sys; print(sys.executable,sys.flags.isolated,select.__spec__.origin)'
                    done
                    PARAM_OUTPUT_FILE="$OUT/without-python.txt" run_path absent-python-on "$W/only-lint" execute
                    PARAM_OUTPUT_FILE="" run_path absent-python-off "$W/only-lint" execute
                    ;;
                contracts)
                    path="$A/bin:$BASE_PATH"
                    for setting in clean error warning strict hidden strict-hidden; do
                        PARAM_TARGETS=tree/warn.yml; PARAM_STRICT=false; PARAM_NO_WARNINGS=false
                        case "$setting" in
                            clean) PARAM_TARGETS=tree/ok.yml ;;
                            error) PARAM_TARGETS=tree/error.yml ;;
                            strict) PARAM_STRICT=true ;;
                            hidden) PARAM_NO_WARNINGS=true ;;
                            strict-hidden) PARAM_STRICT=true; PARAM_NO_WARNINGS=true ;;
                        esac
                        for mode in off on; do
                            id="contract-$setting-$mode"; PARAM_OUTPUT_FILE=""
                            if [[ $mode == on ]]; then PARAM_OUTPUT_FILE="$OUT/$id.txt"; fi
                            run_path "$id" "$path" execute "PYTHONPATH=$W/tracer" "M2_CLI_TRACE=$TRACE/$id.jsonl"
                            show_trace "$id"
                        done
                    done
                    ;;
                priority)
                    for kind in warnings errors; do
                        export PARAM_TARGETS="$kind"
                        for measure in control limited; do
                            id="priority-$kind-$measure"
                            export PARAM_OUTPUT_FILE="$OUT/$id.txt"
                            obs "$id" /usr/bin/env "PATH=$A/bin:$BASE_PATH" "PYTHONPATH=$W/tracer" "M2_CLI_TRACE=$TRACE/$id.jsonl" "$BASE" -I "$W/fault.py" "$REPO/src/scripts/execute.sh" "$measure"
                            show_trace "$id"
                        done
                    done
                    ;;
                failures)
                    run_path missing-cli-show "$W/no-cli" show-version
                    run_path missing-cli-lint "$W/no-cli" execute
                    PARAM_LIST_FILES=true run_path missing-cli-list "$W/no-cli" execute
                    PARAM_OUTPUT_FILE="$OUT/missing-cli.txt" run_path missing-cli-save "$W/no-cli" execute
                    PARAM_TARGETS=- run_path missing-cli-invalid-target "$W/no-cli" execute
                    PARAM_CONFIG_DATA="extends: default" run_path missing-cli-two-configs "$W/no-cli" execute
                    # This is the explicit-path experiment. Baseline Orb has no environment-selection input.
                    obs selection-missing-cli /usr/bin/env "PATH=$B/bin:$BASE_PATH" "$W/absent/bin/yamllint" --version
                    obs selection-missing-python /usr/bin/env "PATH=$B/bin:$BASE_PATH" "$W/absent/bin/python" -m yamllint --version
                    obs selection-alternative-available "$B/bin/yamllint" --version
                    ;;
            esac
            M2_FILE
            cat > /tmp/m2-work/check.py \<<'M2_FILE'
            """Check evidence integrity. Product statuses remain in the raw observation index."""
            import csv
            import hashlib
            import json
            import os
            from pathlib import Path

            root = Path("/tmp/meas")
            work = Path("/tmp/m2-work")
            env_id = os.environ["MEAS_ENV_ID"]
            traces = root / "traces"
            saved = root / "saved"
            readings = root / "readings" / env_id
            base = (work / "base-python").read_text().strip()
            rows = list(csv.DictReader((root / (env_id + ".index.tsv")).open(), delimiter="\t"))
            rc = {row["reading"]: int(row["exit"]) for row in rows}
            errors = []
            def check(ok, detail):
                if not ok:
                    errors.append(detail)
            def stream(i, name):
                return (readings / (i + "." + name)).read_bytes()
            def trace(i):
                return [json.loads(line) for line in (traces / (i + ".jsonl")).read_text().splitlines()]
            def same_measurement(i, plain):
                check((rc[i], stream(i, "stdout"), stream(i, "stderr")) ==
                      (rc[plain], stream(plain, "stdout"), stream(plain, "stderr")), i + " observation differs under instrumentation")
            def cli(i, role):
                entries = trace(i)
                check(len(entries) == 1, i + " CLI event count")
                prefix = str(work / role)
                for event in entries:
                    check(event["cli"] == prefix + "/bin/yamllint" and event["prefix"] == prefix, i + " CLI identity")
                    check(event["python"].startswith(prefix + "/bin/") and bool(event["module"]) and
                          event["module"].startswith(prefix + "/") and bool(event["version"]), i + " Python/module identity")

            check(len(rc) == len(rows), "duplicate reading names")
            for role in ("A", "B"):
                for act in ("show", "lint", "listing"):
                    case = f"route-{role}-{act}"
                    cli(case, role)
                    same_measurement(case, case + "-plain")

            if rc["base-cli-resolution"] == 0:
                for act in ("show", "lint", "listing"):
                    case = "route-base-" + act
                    same_measurement(case, case + "-plain")
                    events = trace(case)
                    check(len(events) == 1 and all(events[0][k] for k in ("python", "cli", "module", "version")), case + " base CLI identity")
            else:
                check(all("base-" + act in rc for act in ("show", "lint", "listing")), "missing clean-base Orb observations")

            for role in ("base", "venv"):
                case = "save-" + role
                events = trace(case)
                check(sorted(e["operation"] for e in events) == ["finalize", "forward", "prepare"], case + " helper stages")
                for e in events:
                    if role == "base":
                        check(e["python"] == base and e["prefix"] == e["base_prefix"], case + " must use captured base interpreter")
                    else:
                        check(e["prefix"] == str(work / "A") and e["prefix"] != e["base_prefix"], case + " must use A")
                    check(e["isolated"] == 1 and all(e["stdlib"].values()), case + " isolation/modules")
                cli(case + "-cli", "A")
                same_measurement(case, case + "-plain")
                for mode in ("traced", "plain"):
                    path = saved / f"{case}-{mode}.txt"
                    check(path.is_file() and path.read_bytes() == stream(case, "stdout"), case + " saved bytes " + mode)

            observed = {}
            for setting in ("clean", "error", "warning", "strict", "hidden", "strict-hidden"):
                off, on = (f"contract-{setting}-{mode}" for mode in ("off", "on"))
                cli(off, "A")
                cli(on, "A")
                same_measurement(off, on)
                path = saved / (on + ".txt")
                check(path.is_file() and path.read_bytes() == stream(on, "stdout"), on + " saved bytes")
                observed[setting] = {"disabled": rc[off], "enabled": rc[on], "saved_bytes": path.stat().st_size if path.exists() else None}
            for kind in ("warnings", "errors"):
                control, limited = (f"priority-{kind}-{mode}" for mode in ("control", "limited"))
                cli(control, "A")
                cli(limited, "A")
                check(len(stream(control, "stdout")) > 1024, control + " output does not exceed limit")
                check(stream(control, "stdout") == stream(limited, "stdout"), limited + " stdout different from control")
                check((saved / (control + ".txt")).read_bytes() == stream(control, "stdout"), control + " saved bytes")
                observed[limited] = {"orb_status": rc[limited], "saved": (saved / (limited + ".txt")).exists(),
                                     "file_size_fault": b"File too large" in stream(limited, "stderr")}
                check(observed[limited]["file_size_fault"], limited + " fault did not exercise output writing")
            for role in ("after-A", "after-B"):
                check(rc["prefix-" + role] == 0, role + " retained consumer prefix or marker check failed")
            for i in ("missing-cli-show", "missing-cli-lint", "missing-cli-list", "missing-cli-save", "missing-cli-invalid-target",
                      "missing-cli-two-configs", "selection-missing-cli", "selection-missing-python", "absent-python-on", "absent-python-off"):
                check(i in rc, i + " observation missing")
            observed["temporary_files"] = sorted(p.name for p in saved.glob(".yamllint-orb-output-*"))
            observed["saved_files"] = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(saved.iterdir()) if p.is_file()}
            print(json.dumps({"schema": 1, "candidate": env_id, "results": observed, "evidence_errors": errors}, indent=2, sort_keys=True))
            raise SystemExit(bool(errors))
            M2_FILE
            cat > /tmp/m2-work/fault.py \<<'M2_FILE'
            """Only the Orb process tree inherits the limit. Drain both pipes outside it."""
            import os
            import resource
            import subprocess
            import sys

            def limit_file_size():
                resource.setrlimit(resource.RLIMIT_FSIZE, (1024, 1024))

            result = subprocess.run(["/bin/bash", sys.argv[1]], stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                    preexec_fn=limit_file_size if sys.argv[2] == "limited" else None)
            sys.stdout.buffer.write(result.stdout)
            sys.stderr.buffer.write(result.stderr)
            raise SystemExit(result.returncode if result.returncode >= 0 else 128 - result.returncode)
            M2_FILE
            cat > /tmp/m2-work/tracer/sitecustomize.py \<<'M2_FILE'
            """Record the actual running console script at exit, outside its two output streams."""
            import atexit
            import json
            import os
            import sys

            def write_identity():
                module = sys.modules.get("yamllint")
                event = {
                    "argv0": sys.argv[0], "cli": os.path.realpath(sys.argv[0]),
                    "python": sys.executable, "prefix": sys.prefix, "base_prefix": sys.base_prefix,
                    "module": getattr(module, "__file__", None),
                    "version": getattr(module, "__version__", None),
                }
                with open(os.environ["M2_CLI_TRACE"], "a", encoding="utf-8") as output:
                    output.write(json.dumps(event, sort_keys=True) + "\n")

            if os.path.basename(sys.argv[0]) == "yamllint" and os.environ.get("M2_CLI_TRACE"):
                atexit.register(write_identity)
            M2_FILE
            cat > /tmp/m2-work/save-probe.py \<<'M2_FILE'
            # This prelude runs in the same -I Python invocation immediately before the original helper.
            import importlib.util as _m2_util, json as _m2_json, os as _m2_os, sys as _m2_sys
            _m2_event = {
                "operation": _m2_sys.argv[1], "resolved_python3": _m2_os.environ["M2_REAL_PY"],
                "python": _m2_sys.executable, "prefix": _m2_sys.prefix, "base_prefix": _m2_sys.base_prefix,
                "isolated": _m2_sys.flags.isolated, "stdlib": {
                    k: _m2_util.find_spec(k).origin for k in ("os", "select", "stat", "sys")
                },
            }
            with open(_m2_os.environ["M2_SAVE_TRACE"], "a", encoding="utf-8") as _m2_log:
                _m2_log.write(_m2_json.dumps(_m2_event, sort_keys=True) + "\n")
            M2_FILE
            cat > /tmp/m2-work/save-wrapper/python3 \<<'M2_FILE'
            #!/bin/bash
            set -eu
            if [[ ${1:-} == -I && ${2:-} == -c ]]; then
                original=$3
                shift 3
                exec "$M2_REAL_PY" -I -c "$(< /tmp/m2-work/save-probe.py)
            $original" "$@"
            fi
            exec "$M2_REAL_PY" "$@"
            M2_FILE
            chmod +x /tmp/m2-work/save-wrapper/python3
            source /tmp/m2-work/shared.sh
            mkdir -p "$FIX/tree" "$W/no-cli" "$W/only-lint" "$W/lint-A" "$TRACE" "$OUT"
            printf '%s\n' "$PATH" > "$W/base-path"
            python3 -c 'import sys; assert sys.prefix == sys.base_prefix; print(sys.executable)' > "$W/base-python"
            BASE=$(< "$W/base-python")
            require_obs base-identity "$BASE" -c 'import sys; print(sys.executable, sys.prefix, sys.base_prefix, sys.version)'
            for spec in A:1.38.0 B:1.37.1; do
                name=${spec%:*}
                version=${spec#*:}
                require_obs "create-$name" "$BASE" -m venv "$W/$name"
                require_obs "install-$name" "$W/$name/bin/python" -m pip --isolated install --disable-pip-version-check --index-url https://pypi.org/simple "yamllint==$version"
            done
            ln -s "$A/bin/yamllint" "$W/lint-A/yamllint"
            ln -s "$A/bin/yamllint" "$W/only-lint/yamllint"
            ln -s "$BASE" "$W/no-cli/python3"
            printf '%s\n' "$A" > "$W/explicit-destination"
            printf '%s\n' '---' 'key: ok' > "$FIX/tree/ok.yml"
            printf '%s\n' '---' 'key: [' > "$FIX/tree/error.yml"
            printf '%s\n' '---' 'key: abcdefghijklmnopqrstuvwxyz0123456789' > "$FIX/tree/warn.yml"
            printf '%s\n' 'extends: default' 'rules:' '  line-length:' '    max: 20' '    level: warning' > "$FIX/warn.cfg"
            # Deliberately visible to non-isolated interpreters for which select is not built in.
            printf '%s\n' 'M2_LOCAL_SHADOW = True' > "$FIX/select.py"
            mkdir -p "$FIX/warnings" "$FIX/errors"
            for n in {1..64}; do
                cp "$FIX/tree/warn.yml" "$FIX/warnings/w$n.yml"
                cp "$FIX/tree/error.yml" "$FIX/errors/e$n.yml"
            done
      - run:
          name: S1 Read explicit destination in a new consumer step
          command: |
            source /tmp/m2-work/shared.sh

            IFS= read -r dest < "$W/explicit-destination"
            obs explicit-consumer-shell shell_view
            cd "$FIX"
            obs explicit-show "$dest/bin/yamllint" --version
            obs explicit-list "$dest/bin/yamllint" --list-files tree
            obs explicit-tree-lint "$dest/bin/yamllint" -c warn.cfg tree
      - run:
          name: S2 Intervening user step exports a different PATH
          command: |
            source /tmp/m2-work/shared.sh

            export PATH="$B/bin:$PATH"
            obs user-export-shell shell_view
            obs user-export-default yamllint --version
            IFS= read -r dest < "$W/explicit-destination"
            obs user-export-explicit "$dest/bin/yamllint" --version
            obs explicit-next-selected-B "$B/bin/yamllint" --version
            obs explicit-original-after-B "$dest/bin/yamllint" --version
      - run:
          name: S3 Observe the next fresh shell then install a controlled user marker
          command: |
            source /tmp/m2-work/shared.sh

            obs post-export-fresh-shell shell_view
            obs post-export-explicit "$A/bin/yamllint" --version
            [[ -n ${BASH_ENV:-} ]]
            if [[ -e $BASH_ENV ]]; then note 'native BASH_ENV file present'; else note 'native BASH_ENV file absent'; fi
            printf '%s\n' 'export M2_USER_MARK=consumer-r1' 'export PATH="/tmp/m2-work/B/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: S4 Read the user marker and append the selected environment
          command: |
            source /tmp/m2-work/shared.sh

            obs consumer-owned-shell shell_view
            require_obs remember-consumer-prefix prefix_snapshot
            printf '%s\n' 'export PATH="/tmp/m2-work/A/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: S5 Observe the baseline route after A then append B
          command: |
            source /tmp/m2-work/shared.sh

            obs after-A-shell shell_view
            require_obs prefix-after-A prefix_check
            obs existing-route-after-A /bin/bash "$REPO/src/scripts/show-version.sh"
            printf '%s\n' 'export PATH="/tmp/m2-work/B/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: S6 Observe the second handoff and the explicit route
          command: |
            source /tmp/m2-work/shared.sh

            obs after-B-shell shell_view
            require_obs prefix-after-B prefix_check
            obs existing-route-after-B /bin/bash "$REPO/src/scripts/show-version.sh"
            obs explicit-A-after-B "$A/bin/yamllint" --version
      - run:
          name: S7 Trace actual display lint and listing processes
          command: |
            source /tmp/m2-work/shared.sh
            base_path=$(< "$W/base-path")
            exec /usr/bin/env -u BASH_ENV -u PYTHONPATH -u VIRTUAL_ENV "PATH=$base_path" /bin/bash "$W/cases.sh" resolution
      - run:
          name: S8 Compare the base and selected saving interpreters
          command: |
            source /tmp/m2-work/shared.sh
            base_path=$(< "$W/base-path")
            exec /usr/bin/env -u BASH_ENV -u PYTHONPATH -u VIRTUAL_ENV "PATH=$base_path" /bin/bash "$W/cases.sh" saving
      - run:
          name: S9 Compare warning and error output with saving on and off
          command: |
            source /tmp/m2-work/shared.sh
            base_path=$(< "$W/base-path")
            exec /usr/bin/env -u BASH_ENV -u PYTHONPATH -u VIRTUAL_ENV "PATH=$base_path" /bin/bash "$W/cases.sh" contracts
      - run:
          name: S10 Record selection and real Orb failures
          command: |
            source /tmp/m2-work/shared.sh
            base_path=$(< "$W/base-path")
            exec /usr/bin/env -u BASH_ENV -u PYTHONPATH -u VIRTUAL_ENV "PATH=$base_path" /bin/bash "$W/cases.sh" failures
      - run:
          name: S11 Measure write-failure priority with a known linter
          command: |
            source /tmp/m2-work/shared.sh
            base_path=$(< "$W/base-path")
            exec /usr/bin/env -u BASH_ENV -u PYTHONPATH -u VIRTUAL_ENV "PATH=$base_path" /bin/bash "$W/cases.sh" priority
      - run:
          name: S12 Check that each requested comparison produced evidence
          command: |
            source /tmp/m2-work/shared.sh

            base=$(< "$W/base-python")
            require_obs evidence-check "$base" -I "$W/check.py"
            require_obs final-checkout git status --porcelain
            [[ ! -s $OBS_STDOUT ]]
      - run:
          name: Package evidence including empty streams even after a failed step
          when: always
          command: |
            set -euo pipefail
            mkdir -p /tmp/m2-artifacts
            cd /tmp/meas
            source ./obs.sh
            show_index
            parts=()
            for file in "$MEAS_ENV_ID.log" "$MEAS_ENV_ID.index.tsv" readings saved traces; do
                if [[ -e $file ]]; then parts+=("$file"); fi
            done
            find "${parts[@]}" -type f -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
            tar -czf "/tmp/m2-artifacts/$MEAS_ENV_ID.tar.gz" SHA256SUMS "${parts[@]}"
            cd /tmp/m2-artifacts
            sha256sum "$MEAS_ENV_ID.tar.gz" > "$MEAS_ENV_ID.tar.gz.sha256"
      - store

workflows:
  measure-m2-supplement:
    when:
      and:
        - equal: ["exp/230-m2", << pipeline.git.branch >>]
        - not:
            equal: ["", << pipeline.parameters.approved-commit >>]
        - not:
            equal: ["", << pipeline.parameters.approved-config-sha256 >>]
    jobs:
      # The manually triggered pipeline waits here until a person
      # approves this hold in the CircleCI UI. That keeps the start of the
      # measurement separate from the push and gives it its own timestamp.
      # The approval in section 11.1 of the plan remains the authoritative one.
      - hold-until-approved:
          type: approval
      - m2:
          name: m2-supp-E01-cimg-py314
          env_id: E01
          image: cimg/python:3.14
          requires:
            - hold-until-approved
      - m2:
          name: m2-supp-E02-cimg-py313
          env_id: E02
          image: cimg/python:3.13
          requires:
            - hold-until-approved
      - m2:
          name: m2-supp-E03-ubuntu-2204
          env_id: E03
          image: ubuntu:22.04
          apt: true
          requires:
            - hold-until-approved
      - m2:
          name: m2-supp-E04-ubuntu-2404
          env_id: E04
          image: ubuntu:24.04
          apt: true
          requires:
            - hold-until-approved
